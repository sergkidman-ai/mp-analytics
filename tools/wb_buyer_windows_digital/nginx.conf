# поток: ret. Digital-only QR download, upload and Pult pairing.
location = /download/returns/WB_Tsifrovoy_QR_Windows.zip {
    auth_basic "Пульт бизнеса";
    auth_basic_user_file /etc/nginx/.htpasswd-bi;
    alias /opt/mp-analytics/web/downloads/returns/WB_Tsifrovoy_QR_Windows.zip;
    types { }
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="WB_Tsifrovoy_QR_Windows.zip"';
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /api/returns/wb-qr/tsifrovoy {
    auth_basic off;
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header Host $host;
    proxy_set_header X-Pult-User "";
    proxy_read_timeout 25s;
    access_log off;
}
location = /returns/wb-qr/setup/tsifrovoy {
    auth_basic "Пульт бизнеса";
    auth_basic_user_file /etc/nginx/.htpasswd-bi;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header X-Pult-User $remote_user;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    access_log off;
}
