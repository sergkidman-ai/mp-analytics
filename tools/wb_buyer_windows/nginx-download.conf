# поток: ret — fixed ZIP download through the existing Pult Business login.
location = /download/returns/WB_Diskver_QR_Test_Windows.zip {
    auth_basic "Пульт бизнеса";
    auth_basic_user_file /etc/nginx/.htpasswd-bi;
    alias /opt/mp-analytics/web/downloads/returns/WB_Diskver_QR_Test_Windows.zip;
    types { }
    default_type application/zip;
    add_header Content-Disposition 'attachment; filename="WB_Diskver_QR_Test_Windows.zip"';
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
