# поток: ret. Scope-limited bearer upload, separate from the Pult UI authentication.
location = /api/returns/wb-qr/diskver {
    auth_basic off;
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header Host $host;
    proxy_set_header X-Pult-User "";
    proxy_read_timeout 25s;
    access_log off;
}
location = /returns/wb-qr/setup {
    auth_basic "Пульт бизнеса";
    auth_basic_user_file /etc/nginx/.htpasswd-bi;
    proxy_pass http://127.0.0.1:8096;
    proxy_set_header X-Pult-User $remote_user;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
    access_log off;
}
