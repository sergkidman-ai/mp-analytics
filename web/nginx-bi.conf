# Применить ПОСЛЕ того как bi.metaverseworld.ru → 155.212.189.66 (A-запись).
# Установка: cp web/nginx-bi.conf /etc/nginx/sites-available/bi.metaverseworld.ru
#   htpasswd -c /etc/nginx/.htpasswd-bi <user>   # пароль для входа
#   ln -s ... sites-enabled/ ; nginx -t ; systemctl reload nginx
#   certbot --nginx -d bi.metaverseworld.ru      # HTTPS (Let's Encrypt)
#   htpasswd -c /etc/nginx/.htpasswd-novelties novelty   # оператор раздела «Новинки»
#   grep '^<владелец>:' /etc/nginx/.htpasswd-bi >> /etc/nginx/.htpasswd-novelties
#
# Это СНИМОК боевого конфига (31.08.2026), а не заготовка: блоки `listen 443`, сертификаты и
# редирект с 80 добавлены certbot-ом на сервере. Правишь боевой — обнови и этот файл, иначе
# они снова разойдутся. Сами файлы паролей в репозиторий не попадают.
server {
    server_name bi.metaverseworld.ru;

    # Маркетинг (домен mkt) — отдельный процесс :8092 (web.marketing_app), чтобы правки
    # общего app.py финансовой ветки не влияли на страницу маркетинга. Всё остальное — :8090.
    location = /marketing {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /api/marketing {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /margin-control {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location = /api/margin-control {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    # Ставки WB (домен mkt). Страница — точный матч; API — ПРЕФИКС (есть под-пути
    # /manual, /change, /log), потому не `location =`.
    location = /wb-bids {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/wb-bids {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Маркетинг Ozon (домен mkt) — страницы и API одним префиксом: /ozon-economics,
    # /ozon-margin-control, /ozon-bids, /ozon-queries и то, что появится дальше. Без этого
    # блока они падали в `location /` на :8090 (финансовый app.py) и отдавали 404.
    location ^~ /ozon- {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location ^~ /api/ozon- {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Возврат из СберБизнес ID. Без auth_basic: сюда браузер приводит банк, пароля от «Пульта»
    # у него нет — с basic-аутентификацией банк получал 401, а одноразовый код сгорал впустую.
    # Открытость безопасна: код бесполезен без client_secret и клиентского сертификата mTLS,
    # которые лежат на сервере; в ответ страница отдаёт только «получилось / не получилось».
    location = /sber/callback {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Раздел «Новинки» (поток prc) — свой файл паролей: сотрудник, который разбирает прайсы,
    # входит логином `novelty` и дальше этих путей не проходит. Владелец `max` есть в обоих
    # файлах, поэтому для него ничего не меняется. Вторая линия — X-Pult-User в web/app.py.
    location = /warehouse/novelties {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-novelties;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location ^~ /warehouse/novelties/img/ {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-novelties;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location ^~ /api/novelties {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-novelties;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location ^~ /api/blacklist {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-novelties;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location ^~ /api/unlinked {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-novelties;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        auth_basic "Пульт бизнеса";
        auth_basic_user_file /etc/nginx/.htpasswd-bi;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Pult-User $remote_user;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bi.metaverseworld.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bi.metaverseworld.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = bi.metaverseworld.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bi.metaverseworld.ru;
    return 404; # managed by Certbot


}